<% target_db = ENV["TARGET_DB"] || "sqlite" %>

<% if target_db == "sqlite" %>
default: &default
  adapter: sqlite3
  pool: 50
  <% if Rails::VERSION::MAJOR >= 8 %>
  timeout: 5000
  <% else %>
  retries: 100 # "retries" is deprecated in rails 8 and will be removed in rails 8.1
  <% end %>

<% elsif target_db == "postgres" %>
default: &default
  adapter: postgresql
  encoding: unicode
  username: postgres
  pool: 20
  host: "127.0.0.1"
  port: 5432
  gssencmode: disable # https://github.com/ged/ruby-pg/issues/311

<% else %>
default: &default
  adapter: mysql2
  username: root
  pool: 20
  host: "127.0.0.1"
  port: 3306
<% end %>

development:
  primary:
    <<: *default
    database: <%= target_db == "sqlite" ? "db/development.sqlite3" : "development" %>

test:
  primary:
    <<: *default
    database: <%= target_db == "sqlite" ? "db/narabikae_test.sqlite3" : "narabikae_test" %>
